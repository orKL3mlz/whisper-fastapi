services:
  whisper-fastapi:
    build: .
    image: whisper-fastapi-local:latest
    container_name: whisper-fastapi
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - hf-cache:/root/.cache/huggingface
    command: ["--model", "Infomaniak-AI/faster-whisper-large-v3-turbo"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.whisper-fastapi.loadbalancer.server.port=5000"
      - "traefik.http.routers.whisper-fastapi.rule=Host(\"fasterwhisper.local\")"

volumes:
  hf-cache: